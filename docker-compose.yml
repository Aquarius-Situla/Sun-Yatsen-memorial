# ============================================================================
# Private Sun Yat-sen Memorial Hall — Docker Compose (docker-compose.yml)
# ============================================================================
# COMMENTING STANDARDS
# 1. Block-style comments only (full line `#`). Inline comments are strictly
#    prohibited.
# 2. Section dividers use the === banner format.
# 3. All prose is written in English.
# 4. No debugging notes or temporary workarounds in committed code.
# 5. Store temporary files under /temp/[feature_name]/.
# ============================================================================

services:
  sys-memorial:
    image: nginx:alpine
    container_name: sys-memorial
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html:ro
    # ========================================================================
    # Uncomment the ports mapping below for direct IP testing without a proxy.
    # ========================================================================
    # ports:
    #   - "8085:80"
    networks:
      - npm_default

# ============================================================================
# Network Configuration
# ============================================================================
# Connects the container to an existing external network. 
# `npm_default` is the default internal Docker network automatically created 
# when deploying Nginx Proxy Manager. This allows the proxy to route traffic
# directly to this container without exposing ports to the host machine.
# ============================================================================
networks:
  npm_default:
    external: true
