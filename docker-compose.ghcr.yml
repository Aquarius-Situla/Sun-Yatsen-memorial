# ============================================================================
# Private Sun Yat-sen Memorial Hall — GHCR Full-Stack Compose
# ============================================================================
# Deploys prebuilt frontend and backend container images from GitHub Container
# Registry (ghcr.io). Set ADMIN_SECRET and WORKER_API in your environment or
# a local .env file before running `docker compose -f docker-compose.ghcr.yml up -d`.
# ============================================================================

services:
  frontend:
    image: ghcr.io/aquarius-situla/sun-yatsen-memorial-frontend:latest
    container_name: sys-memorial-frontend
    restart: always
    environment:
      - WORKER_API=${WORKER_API:-}
    ports:
      - "8085:80"
    depends_on:
      - backend

  backend:
    image: ghcr.io/aquarius-situla/sun-yatsen-memorial-backend:latest
    container_name: sys-memorial-backend
    restart: always
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET:?ADMIN_SECRET must be set}
      - PORT=8787
      - KV_DATA_PATH=/data/kv.json
    ports:
      - "8787:8787"
    volumes:
      - backend_kv_data:/data

volumes:
  backend_kv_data:
