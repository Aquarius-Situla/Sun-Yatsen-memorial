    <script>
        /* Dynamically preload the iOS splash screen for the current device to prevent animation loss when added to the home screen */
        (function() {
            var links = document.querySelectorAll('link[rel="apple-touch-startup-image"]');
            for (var i = 0; i < links.length; i++) {
                if (window.matchMedia(links[i].getAttribute('media')).matches) {
                    var preload = document.createElement('link');
                    preload.rel = 'preload';
                    preload.as = 'image';
                    preload.href = links[i].getAttribute('href');
                    document.head.appendChild(preload);
                }
            }
        })();

        if (window.location.hash === '#captcha') {
            window.location.replace('captcha/index.html');
        } else if (window.location.hash === '#admin') {
            window.location.replace('pages/admin/index.html');
        }
