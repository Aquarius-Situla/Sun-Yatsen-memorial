    <style>
        /* Global Settings */
        html, body {
            background-color: #111111;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            overflow-x: hidden;
        }

        .page-transition {
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease !important;
            transform: translateX(100%) !important;
            opacity: 0 !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px 20px;
            min-height: 100vh;
        }
        
        /* Markdown卡片與圖表容器 */
        .markdown-container,
        .charts-container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1a1a; 
            padding: 45px 50px; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.4s ease;
            display: none; /* 預設隱藏，靠JS控制 */
        }
        .markdown-container.loaded,
        .charts-container.loaded {
            opacity: 1;
        }
        .markdown-container.active,
        .charts-container.active {
            display: block;
        }

        /* Tab Navigation */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            background-color: #1a1a1a;
            color: #888888;
            border: 1px solid #333333;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active {
            background-color: #2d1e0d;
            color: #f1c40f;
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.15);
        }
        @media (hover: hover) and (pointer: fine) {
            .tab-btn:hover:not(.active) {
                color: #cccccc;
                border-color: #555555;
            }
        }
        
        .chart-box {
            margin-bottom: 40px;
        }
        .chart-title {
            color: #f1c40f;
            text-align: center;
            font-size: 18px;
            margin-bottom: 20px;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        /* Language Toggle */
        .lang-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background-color: #1a1a1a;
            color: #aaaaaa;
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        /* Back Button */
        .top-back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            display: inline-flex;
            align-items: center;
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: color 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 100;
        }

        .lang-toggle-btn:active {
            color: #f1c40f;
            border-color: #f1c40f;
        }

        .top-back-btn:active {
            color: #cccccc;
            opacity: 0.8;
        }

        @media (hover: hover) and (pointer: fine) {
            .lang-toggle-btn:hover {
                color: #f1c40f;
                border-color: #f1c40f;
                box-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
            }
            .top-back-btn:hover {
                color: #cccccc;
                opacity: 0.8;
            }
        }

        .top-back-btn svg {
            width: 22px;
            height: 22px;
            margin-right: 2px;
            margin-left: -4px;
        }

        .show-all-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #555555;
            background-color: transparent;
            cursor: pointer;
            color: #aaaaaa;
            font-size: 13px;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            transition: all 0.3s ease;
        }
        .show-all-btn:active {
            color: #f1c40f;
            border-color: #f1c40f;
        }
        @media (hover: hover) and (pointer: fine) {
            .show-all-btn:hover {
                color: #f1c40f;
                border-color: #f1c40f;
                box-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
            }
        }

        /* Desktop Layout Adaptations */
        @media (min-width: 769px) {
            .icon-ios { display: none; }
            .icon-macos { display: block; }
        }

        /* Mobile Layout Adaptations */
        @media (max-width: 768px) {
            body {
                padding: 65px 16px 30px 16px; 
            }
            .tabs-container {
                margin-top: 0;
            }
            .markdown-container,
            .charts-container {
                padding: 30px 25px; 
                margin-top: 0;
            }
            .top-back-btn {
                top: 20px;
                left: 16px;
                font-size: 17px;
            }
            .top-back-btn svg {
                width: 24px;
                height: 24px;
            }
            .lang-toggle-btn {
                top: 20px;
                right: 16px;
                padding: 6px 12px;
                font-size: 12px;
            }
            .icon-ios { display: block; }
            .icon-macos { display: none; }
        }

        /* ===== Light mode overrides ===== */
        @media (prefers-color-scheme: light) {
            html, body {
                background-color: #f5f0e8;
                color: #2c1810;
            }
            .markdown-container,
            .charts-container {
                background-color: #ede8dc;
                border-color: #c4a876;
                box-shadow: 0 10px 30px rgba(80,50,10,0.12);
            }
            .tab-btn {
                background-color: #ede8dc;
                color: #7a5500;
                border-color: #c4a876;
            }
            .tab-btn.active {
                background-color: #f5e8c8;
                color: #7a4f00;
                border-color: #b8860b;
                box-shadow: 0 0 10px rgba(184,134,11,0.2);
            }
            @media (hover: hover) and (pointer: fine) {
                .tab-btn:hover:not(.active) {
                    color: #2c1810;
                    border-color: #8a6400;
                }
            }
            .chart-title {
                color: #7a4f00;
                border-bottom-color: #c4a876;
            }
            .lang-toggle-btn {
                background-color: #ede8dc;
                color: #6b4c35;
                border-color: #c4a876;
            }
            .lang-toggle-btn:active {
                color: #b8860b;
                border-color: #b8860b;
            }
            @media (hover: hover) and (pointer: fine) {
                .lang-toggle-btn:hover {
                    color: #b8860b;
                    border-color: #b8860b;
                    box-shadow: 0 0 10px rgba(184,134,11,0.2);
                }
            }
            .show-all-btn {
                color: #6b4c35;
                border-color: #c4a876;
            }
            .show-all-btn:active {
                color: #b8860b;
                border-color: #b8860b;
            }
            @media (hover: hover) and (pointer: fine) {
                .show-all-btn:hover {
                    color: #b8860b;
                    border-color: #b8860b;
                    box-shadow: 0 0 10px rgba(184,134,11,0.2);
                }
            }
            .top-back-btn {
                color: #8a7060;
            }
            .top-back-btn:active {
                color: #2c1810;
            }
            @media (hover: hover) and (pointer: fine) {
                .top-back-btn:hover {
                    color: #2c1810;
                }
            }
        }
    </style>
</head>
<body>

    <a href="../../index.html?from=return" class="top-back-btn">
        <svg class="icon-ios" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <svg class="icon-macos" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">

        <span>返回</span>
    </a>

    <button id="lang-btn" class="lang-toggle-btn">切换至简化字</button>

    <div class="tabs-container" id="tabs">
        <button class="tab-btn active" data-tab="biography">生平傳記</button>
        <button class="tab-btn" data-tab="theories">思想與歷程</button>
    </div>

    <div class="markdown-container active" id="md-section">
        <zero-md id="md-viewer" src="./biography_tc.md">
            <template>
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown-dark.css">
                
                <style>
                    .markdown-body {
                        color: #e5e7eb !important; 
                        background-color: transparent !important; 
                        font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important; 
                        line-height: 1.8;
                        padding: 0 15px !important; 
                        overflow-wrap: break-word !important;
                        word-wrap: break-word !important;
                        word-break: break-all !important;
                    }
                    .markdown-body h1, .markdown-body h2 {
                        color: #ffffff !important; 
                        border-bottom-color: #333333 !important;

                    .markdown-body a {

                    }
                    .markdown-body li {
                        margin-bottom: 8px !important;
                    }
                </style>
            </template>
        </zero-md>
    </div>

    <div class="charts-container" id="charts-section">
        <div class="chart-box">
            <div class="chart-title" id="chart1-title">革命歷程影響力走勢</div>
            <canvas id="influenceChart"></canvas>
        </div>
        <div class="chart-box">
            <div class="chart-title" id="chart2-title">三民主義核心結構</div>
            <canvas id="sanminChart"></canvas>
            <div style="text-align: center; margin-top: 15px;">
                <button id="show-all-btn" class="show-all-btn">顯示全部</button>
            </div>
        </div>
    </div>

    <script>
        const langBtn = document.getElementById('lang-btn');
        const mdViewer = document.getElementById('md-viewer');
        const pageTitle = document.getElementById('page-title');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const mdSection = document.getElementById('md-section');
        const chartsSection = document.getElementById('charts-section');
        const chart1Title = document.getElementById('chart1-title');
        const chart2Title = document.getElementById('chart2-title');
        const showAllBtn = document.getElementById('show-all-btn');
        
        let isTraditional = true;
        let currentTab = 'biography';
        let influenceChartInstance = null;
        let sanminChartInstance = null;
        let isAllShown = false;

        if (showAllBtn) {
            showAllBtn.addEventListener('click', () => {
                if (sanminChartInstance) {
                    isAllShown = !isAllShown;
                    sanminChartInstance.data.datasets.forEach((ds, i) => {
                        if (!isAllShown) {
                            sanminChartInstance.setDatasetVisibility(i, false); // 完全隐藏
                        } else {
                            sanminChartInstance.setDatasetVisibility(i, true);
                        }
                    });
                    sanminChartInstance.update();
                    showAllBtn.textContent = isAllShown 
                        ? (isTraditional ? '隱藏全部' : '隐藏全部')
                        : (isTraditional ? '顯示全部' : '显示全部');
                }
            });
        }

        function renderCharts() {
            if (influenceChartInstance) influenceChartInstance.destroy();
            if (sanminChartInstance) sanminChartInstance.destroy();

            const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
            Chart.defaults.color = isDarkMode ? '#aaaaaa' : '#6b4c35';
            Chart.defaults.font.family = '-apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif';

            const ctx1 = document.getElementById('influenceChart').getContext('2d');
            influenceChartInstance = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: isTraditional 
                        ? ['興中會成立', '同盟會成立', '辛亥革命', '建立民國', '護法運動', '國民黨改組']
                        : ['兴中会成立', '同盟会成立', '辛亥革命', '建立民国', '护法运动', '国民党改组'],
                    datasets: [{
                        label: isTraditional ? '革命影響力走勢' : '革命影响力走势',
                        data: [10, 30, 80, 100, 60, 90],
                        borderColor: '#f1c40f',
                        backgroundColor: 'rgba(241, 196, 15, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointBackgroundColor: isDarkMode ? '#111111' : '#f5f0e8',
                        pointBorderColor: '#f1c40f',
                        pointHoverBackgroundColor: '#f1c40f',
                        pointHoverBorderColor: '#ffffff'
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { display: false, min: 0, max: 110 },
                        x: { grid: { color: isDarkMode ? '#333333' : '#d4c4a0' } }
                    }
                }
            });

            const ctx2 = document.getElementById('sanminChart').getContext('2d');
            
            const tooltipDetails = isTraditional ? {
                '民族主義': ['驅除韃虜，恢復中華', '(反對帝國主義與專制統治)'],
                '民權主義': ['創立民國', '(建立主權在民的民主共和國)'],
                '民生主義': ['平均地權，節制資本', '(解決土地與資本問題，實現財富均衡)']
            } : {
                '民族主义': ['驱除鞑虏，恢复中华', '(反对帝国主义与专制统治)'],
                '民权主义': ['创立民国', '(建立主权在民的民主共和国)'],
                '民生主义': ['平均地权，节制资本', '(解决土地与资本问题，实现财富均衡)']
            };

            sanminChartInstance = new Chart(ctx2, {
                type: 'radar',
                data: {
                    labels: isTraditional 
                        ? ['民族主義', '民權主義', '民生主義']
                        : ['民族主义', '民权主义', '民生主义'],
                    datasets: [
                        {
                            label: isTraditional ? '興中會成立' : '兴中会成立',
                            data: [75, 45, 15],
                            backgroundColor: 'rgba(155, 89, 182, 0.3)',
                            borderColor: '#9b59b6',
                            pointBackgroundColor: '#9b59b6',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#9b59b6',
                            borderWidth: 2,
                            hidden: true
                        },
                        {
                            label: isTraditional ? '同盟會成立' : '同盟会成立',
                            data: [85, 65, 45],
                            backgroundColor: 'rgba(52, 152, 219, 0.3)',
                            borderColor: '#3498db',
                            pointBackgroundColor: '#3498db',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#3498db',
                            borderWidth: 2,
                            hidden: true
                        },
                        {
                            label: isTraditional ? '辛亥革命' : '辛亥革命',
                            data: [100, 70, 50],
                            backgroundColor: 'rgba(243, 156, 18, 0.3)',
                            borderColor: '#f39c12',
                            pointBackgroundColor: '#f39c12',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#f39c12',
                            borderWidth: 2
                        },
                        {
                            label: isTraditional ? '建立民國' : '建立民国',
                            data: [90, 100, 60],
                            backgroundColor: 'rgba(46, 204, 113, 0.3)',
                            borderColor: '#2ecc71',
                            pointBackgroundColor: '#2ecc71',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#2ecc71',
                            borderWidth: 2,
                            hidden: true
                        },
                        {
                            label: isTraditional ? '護法運動' : '护法运动',
                            data: [80, 90, 60],
                            backgroundColor: 'rgba(26, 188, 156, 0.3)',
                            borderColor: '#1abc9c',
                            pointBackgroundColor: '#1abc9c',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#1abc9c',
                            borderWidth: 2,
                            hidden: true
                        },
                        {
                            label: isTraditional ? '國民黨改組' : '国民党改组',
                            data: [100, 95, 100],
                            backgroundColor: 'rgba(231, 76, 60, 0.3)',
                            borderColor: '#e74c3c',
                            pointBackgroundColor: '#e74c3c',
                            pointHoverBackgroundColor: '#fff',
                            pointHoverBorderColor: '#e74c3c',
                            borderWidth: 2,
                            hidden: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    },
                    scales: {
                        r: {
                            min: 0,
                            max: 110,
                            angleLines: { color: isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)' },
                            grid: { color: isDarkMode ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)' },
                            pointLabels: {
                                font: { size: 14, weight: 'bold' },
                                color: isDarkMode ? '#e5e7eb' : '#6b4c35',
                                backdropColor: 'transparent'
                            },
                            ticks: { display: false }
                        }
                    },
                    plugins: {
                        legend: { 
                            position: 'bottom',
                            labels: { color: isDarkMode ? '#aaa' : '#6b4c35', padding: 15 }
                        },
                        tooltip: {
                            backgroundColor: isDarkMode ? 'rgba(0, 0, 0, 0.85)' : 'rgba(255, 255, 255, 0.95)',
                            titleColor: isDarkMode ? '#fff' : '#000',
                            bodyColor: isDarkMode ? '#ddd' : '#333',
                            borderColor: isDarkMode ? '#444' : '#ddd',
                            borderWidth: 1,
                            padding: 10,
                            titleFont: { size: 14 },
                            bodyFont: { size: 12 },
                            callbacks: {
                                beforeBody: function(context) {
                                    const label = context[0].label;
                                    const details = tooltipDetails[label];
                                    return ['', details[0], details[1], ''];
                                },
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.raw;
                                }
                            }
                        }
                    }
                }
            });
            
            setTimeout(() => {
                chartsSection.classList.add('loaded');
            }, 50);
        }

        function updateContent() {
            if (currentTab === 'biography') {
                chartsSection.classList.remove('active', 'loaded');
                mdSection.classList.add('active');
                
                const suffix = isTraditional ? '_tc.md' : '_sc.md';
                const newSrc = './biography' + suffix;
                
                if (mdViewer.getAttribute('src') !== newSrc) {
                    mdSection.classList.remove('loaded');
                    mdViewer.setAttribute('src', newSrc);
                } else {
                    mdSection.classList.add('loaded');
                }
            } else if (currentTab === 'theories') {
                mdSection.classList.remove('active', 'loaded');
                chartsSection.classList.add('active');
                renderCharts();
            }
        }

        langBtn.addEventListener('click', () => {
            isTraditional = !isTraditional;
            
            if (isTraditional) {
                langBtn.textContent = '切换至简化字';
                document.documentElement.lang = 'zh-TW';
                tabBtns[0].textContent = '生平傳記';
                tabBtns[1].textContent = '思想與歷程';
                chart1Title.textContent = '革命歷程影響力走勢';
                chart2Title.textContent = '三民主義核心結構';
                if (showAllBtn) showAllBtn.textContent = isAllShown ? '隱藏全部' : '顯示全部';
            } else {
                langBtn.textContent = '切換至正體字';
                document.documentElement.lang = 'zh-CN';
                tabBtns[0].textContent = '生平传记';
                tabBtns[1].textContent = '思想与历程';
                chart1Title.textContent = '革命历程影响力走势';
                chart2Title.textContent = '三民主义核心结构';
                if (showAllBtn) showAllBtn.textContent = isAllShown ? '隐藏全部' : '显示全部';
            }
            updateContent();
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                if(btn.classList.contains('active')) return;
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.getAttribute('data-tab');
                updateContent();
            });
        });

        mdViewer.addEventListener('zero-md-rendered', () => {
            if (currentTab === 'biography') {
                mdSection.classList.add('loaded');
            }
            const links = mdViewer.shadowRoot.querySelectorAll('a');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.startsWith('http')) {
                    link.setAttribute('target', '_blank'); 
                    link.setAttribute('rel', 'noopener noreferrer'); 
                }
            });
        });

        const topBackBtn = document.querySelector('.top-back-btn');
        if (topBackBtn) {
            topBackBtn.addEventListener('click', function(e) {
                e.preventDefault();
                document.body.classList.add('page-transition');
                setTimeout(() => {
                    window.location.href = this.href;
                }, 300);
            });
        }

        // Re-render charts when color scheme changes
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
            if (currentTab === 'theories') renderCharts();
        });

        // ===== zero-md light/dark theme handler =====
        const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');
        function updateMarkdownTheme() {
            const isLight = colorSchemeQuery.matches;
            const template = mdViewer.querySelector('template');
            if (template) {
                const link = template.content.querySelector('link');
                if (link) {
                    link.href = isLight
                        ? 'https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown.css'
                        : 'https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown-dark.css';
                }
                const style = template.content.querySelector('style');
                if (style) {
                    style.textContent = getMarkdownStyles(isLight);
                }
            }
            if (currentTab === 'biography') {
                const currentSrc = mdViewer.getAttribute('src');
                mdViewer.removeAttribute('src');
                requestAnimationFrame(() => mdViewer.setAttribute('src', currentSrc));
            }
        }
        function getMarkdownStyles(isLight) {
            if (isLight) {
                return `.markdown-body {
                    color: #2c1810 !important;
                    background-color: transparent !important;
                    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important;
                    line-height: 1.8;
                    padding: 0 15px !important;
                    overflow-wrap: break-word !important;
                    word-wrap: break-word !important;
                    word-break: break-all !important;
                }
                .markdown-body h1, .markdown-body h2 {
                    color: #2c1810 !important;
                    border-bottom-color: #c4a876 !important;
                    padding-bottom: 10px;
                }
                .markdown-body a { color: #b8860b !important; text-decoration: none; }
                .markdown-body a:hover { text-decoration: underline; }
                .markdown-body ul { margin-bottom: 20px !important; }
                .markdown-body li { margin-bottom: 8px !important; }`;
            } else {
                return `.markdown-body {
                    color: #e5e7eb !important;
                    background-color: transparent !important;
                    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important;
                    line-height: 1.8;
                    padding: 0 15px !important;
                    overflow-wrap: break-word !important;
                    word-wrap: break-word !important;
                    word-break: break-all !important;
                }
                .markdown-body h1, .markdown-body h2 {
                    color: #ffffff !important;
                    border-bottom-color: #333333 !important;
                    padding-bottom: 10px;
                }
                .markdown-body a { color: #f1c40f !important; text-decoration: none; }
                .markdown-body a:hover { text-decoration: underline; }
                .markdown-body ul { margin-bottom: 20px !important; }
                .markdown-body li { margin-bottom: 8px !important; }`;
            }
        }
        colorSchemeQuery.addEventListener('change', updateMarkdownTheme);
        if (colorSchemeQuery.matches) updateMarkdownTheme();
    </script>

</body>
</html>
