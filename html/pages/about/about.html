<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">關於與聲明 - 私立中山紀念堂</title>
    <link rel="icon" href="../../main/favicon/favicon.svg" type="image/svg+xml">
    
    <link rel="preload" href="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js" as="script" crossorigin="anonymous">
    <link rel="preload" href="./about_cn.md" as="fetch" crossorigin="anonymous">

    <script type="module" src="https://cdn.jsdelivr.net/gh/zerodevx/zero-md@2/dist/zero-md.min.js"></script>
    
    <style>
        /* 全局設定 */
        html, body {
            background-color: #111111;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            overflow-x: hidden;
        }

        .page-transition {
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.3s ease !important;
            transform: translateX(100%) !important;
            opacity: 0 !important;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px 20px;
            min-height: 100vh;
        }
        
        /* Markdown卡片 */
        .markdown-container {
            width: 100%;
            max-width: 800px;
            background-color: #1a1a1a; 
            padding: 45px 50px; 
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
            box-sizing: border-box;
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .markdown-container.loaded {
            opacity: 1;
        }

        /* 标签页导航 */
        .tabs-container {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 800px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar {
            display: none;
        }
        .tab-btn {
            background-color: #1a1a1a;
            color: #888888;
            border: 1px solid #333333;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            white-space: nowrap;
            transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .tab-btn.active {
            background-color: #2d1e0d;
            color: #f1c40f;
            border-color: #f1c40f;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.15);
        }
        @media (hover: hover) and (pointer: fine) {
            .tab-btn:hover:not(.active) {
                color: #cccccc;
                border-color: #555555;
            }
        }

        /* 语言切换 */
        .lang-toggle-btn {
            position: absolute;
            top: 25px;
            right: 25px;
            background-color: #1a1a1a;
            color: #aaaaaa;
            border: 1px solid #333333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }

        /* 返回按钮 */
        .top-back-btn {
            position: absolute;
            top: 25px;
            left: 25px;
            display: inline-flex;
            align-items: center;
            color: #888888;
            text-decoration: none;
            font-size: 15px;
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: color 0.2s ease, opacity 0.2s ease;
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            z-index: 100;
        }

        .lang-toggle-btn:active {
            color: #f1c40f;
            border-color: #f1c40f;
        }

        .top-back-btn:active {
            color: #cccccc;
            opacity: 0.8;
        }

        @media (hover: hover) and (pointer: fine) {
            .lang-toggle-btn:hover {
                color: #f1c40f;
                border-color: #f1c40f;
                box-shadow: 0 0 10px rgba(241, 196, 15, 0.2);
            }
            .top-back-btn:hover {
                color: #cccccc;
                opacity: 0.8;
            }
        }

        .top-back-btn svg {
            width: 22px;
            height: 22px;
            margin-right: 2px;
            margin-left: -4px;
        }

        /* 桌面端适配 */
        @media (min-width: 769px) {
            .icon-ios { display: none; }
            .icon-macos { display: block; }
        }

        /* 移动端适配 */
        @media (max-width: 768px) {
            body {
                padding: 65px 16px 30px 16px; 
            }
            .tabs-container {
                margin-top: 0;
            }
            .markdown-container {
                padding: 30px 25px; 
                margin-top: 0;
            }
            .top-back-btn {
                top: 20px;
                left: 16px;
                font-size: 17px;
            }
            .top-back-btn svg {
                width: 24px;
                height: 24px;
            }
            .lang-toggle-btn {
                top: 20px;
                right: 16px;
                padding: 6px 12px;
                font-size: 12px;
            }
            .icon-ios { display: block; }
            .icon-macos { display: none; }
        }

        /* ===== Light mode overrides ===== */
        @media (prefers-color-scheme: light) {
            html, body {
                background-color: #f5f0e8;
                color: #2c1810;
            }
            .markdown-container {
                background-color: #ede8dc;
                border-color: #c4a876;
                box-shadow: 0 10px 30px rgba(80,50,10,0.12);
            }
            .tab-btn {
                background-color: #ede8dc;
                color: #7a5500;
                border-color: #c4a876;
            }
            .tab-btn.active {
                background-color: #f5e8c8;
                color: #7a4f00;
                border-color: #b8860b;
                box-shadow: 0 0 10px rgba(184,134,11,0.2);
            }
            @media (hover: hover) and (pointer: fine) {
                .tab-btn:hover:not(.active) {
                    color: #2c1810;
                    border-color: #8a6400;
                }
            }
            .lang-toggle-btn {
                background-color: #ede8dc;
                color: #6b4c35;
                border-color: #c4a876;
            }
            .lang-toggle-btn:active {
                color: #b8860b;
                border-color: #b8860b;
            }
            @media (hover: hover) and (pointer: fine) {
                .lang-toggle-btn:hover {
                    color: #b8860b;
                    border-color: #b8860b;
                    box-shadow: 0 0 10px rgba(184,134,11,0.2);
                }
            }
            .top-back-btn {
                color: #8a7060;
            }
            .top-back-btn:active {
                color: #2c1810;
            }
            @media (hover: hover) and (pointer: fine) {
                .top-back-btn:hover {
                    color: #2c1810;
                }
            }
        }
    </style>
</head>
<body>

    <a href="../../index.html?from=return" class="top-back-btn">
        <svg class="icon-ios" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M15 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <svg class="icon-macos" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M14 17l-5-5 5-5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>返回</span>
    </a>

    <button id="lang-btn" class="lang-toggle-btn">切换至简化字</button>

    <div class="tabs-container" id="tabs">
        <button class="tab-btn active" data-tab="about">關於我們</button>
        <button class="tab-btn" data-tab="changelog">更新日誌</button>
    </div>

    <div class="markdown-container">
        <zero-md id="md-viewer" src="./about_cn.md">
            <template id="md-template">
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown-dark.css">
                
                <style>
                    .markdown-body {
                        color: #e5e7eb !important; 
                        background-color: transparent !important; 
                        font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important; 
                        line-height: 1.8;
                        padding: 0 15px !important; 
                        overflow-wrap: break-word !important;
                        word-wrap: break-word !important;
                        word-break: break-all !important; 
                    }
                    .markdown-body h1, .markdown-body h2 {
                        color: #ffffff !important; 
                        border-bottom-color: #333333 !important; 
                        padding-bottom: 10px;
                    }
                    .markdown-body a {
                        color: #f1c40f !important; 
                        text-decoration: none;
                    }
                    .markdown-body a:hover {
                        text-decoration: underline;
                    }
                    .markdown-body ul {
                        margin-bottom: 20px !important;
                    }
                    .markdown-body li {
                        margin-bottom: 8px !important;
                    }
                </style>
            </template>
        </zero-md>
    </div>

    <script>
        const langBtn = document.getElementById('lang-btn');
        const mdViewer = document.getElementById('md-viewer');
        const pageTitle = document.getElementById('page-title');
        const tabBtns = document.querySelectorAll('.tab-btn');
        
        let isTraditional = true;
        let currentTab = 'about';

        function updateMarkdownSource() {
            const suffix = isTraditional ? '_cn.md' : '_cp.md';
            const newSrc = './' + currentTab + suffix;
            
            if (mdViewer.getAttribute('src') !== newSrc) {
                const container = document.querySelector('.markdown-container');
                container.classList.remove('loaded');
                mdViewer.setAttribute('src', newSrc);
            } else {
                document.querySelector('.markdown-container').classList.add('loaded');
            }
        }

        langBtn.addEventListener('click', () => {
            isTraditional = !isTraditional;
            
            if (isTraditional) {
                langBtn.textContent = '切换至简化字';
                document.documentElement.lang = 'zh-TW';
                tabBtns[0].textContent = '關於我們';
                tabBtns[1].textContent = '更新日誌';
            } else {
                langBtn.textContent = '切換至正體字';
                document.documentElement.lang = 'zh-CN';
                tabBtns[0].textContent = '关于我们';
                tabBtns[1].textContent = '更新日志';
            }
            updateMarkdownSource();
        });

        tabBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentTab = btn.getAttribute('data-tab');
                updateMarkdownSource();
            });
        });

// webapp内建链接bug修复
        mdViewer.addEventListener('zero-md-rendered', () => {
            document.querySelector('.markdown-container').classList.add('loaded');
            const links = mdViewer.shadowRoot.querySelectorAll('a');
            links.forEach(link => {
                if (link.href.startsWith('http')) {
                    link.setAttribute('target', '_blank'); 
                    link.setAttribute('rel', 'noopener noreferrer'); 
                }
            });
        });

        // ===== Light/dark mode: dynamic zero-md stylesheet =====
        const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');
        function getMarkdownStyles(isLight) {
            if (isLight) {
                return `.markdown-body {
                    color: #2c1810 !important;
                    background-color: transparent !important;
                    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important;
                    line-height: 1.8;
                    padding: 0 15px !important;
                    overflow-wrap: break-word !important;
                    word-wrap: break-word !important;
                    word-break: break-all !important;
                }
                .markdown-body h1, .markdown-body h2 {
                    color: #2c1810 !important;
                    border-bottom-color: #c4a876 !important;
                    padding-bottom: 10px;
                }
                .markdown-body a {
                    color: #b8860b !important;
                    text-decoration: none;
                }
                .markdown-body a:hover {
                    text-decoration: underline;
                }
                .markdown-body ul { margin-bottom: 20px !important; }
                .markdown-body li { margin-bottom: 8px !important; }`;
            } else {
                return `.markdown-body {
                    color: #e5e7eb !important;
                    background-color: transparent !important;
                    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "PingFang SC", "Microsoft JhengHei", sans-serif !important;
                    line-height: 1.8;
                    padding: 0 15px !important;
                    overflow-wrap: break-word !important;
                    word-wrap: break-word !important;
                    word-break: break-all !important;
                }
                .markdown-body h1, .markdown-body h2 {
                    color: #ffffff !important;
                    border-bottom-color: #333333 !important;
                    padding-bottom: 10px;
                }
                .markdown-body a {
                    color: #f1c40f !important;
                    text-decoration: none;
                }
                .markdown-body a:hover {
                    text-decoration: underline;
                }
                .markdown-body ul { margin-bottom: 20px !important; }
                .markdown-body li { margin-bottom: 8px !important; }`;
            }
        }
        function updateMarkdownTheme() {
            const isLight = colorSchemeQuery.matches;
            const template = mdViewer.querySelector('template');
            if (template) {
                const link = template.content.querySelector('link');
                if (link) {
                    link.href = isLight
                        ? 'https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown.css'
                        : 'https://cdn.jsdelivr.net/gh/sindresorhus/github-markdown-css@4/github-markdown-dark.css';
                }
                const style = template.content.querySelector('style');
                if (style) {
                    style.textContent = getMarkdownStyles(isLight);
                }
            }
            // Force re-render by toggling src
            const currentSrc = mdViewer.getAttribute('src');
            mdViewer.removeAttribute('src');
            requestAnimationFrame(() => mdViewer.setAttribute('src', currentSrc));
        }
        colorSchemeQuery.addEventListener('change', updateMarkdownTheme);
        // Apply on initial load if light mode
        if (colorSchemeQuery.matches) updateMarkdownTheme();

        const topBackBtn = document.querySelector('.top-back-btn');
        if (topBackBtn) {
            topBackBtn.addEventListener('click', function(e) {
                e.preventDefault();
                document.body.classList.add('page-transition');
                setTimeout(() => {
                    window.location.href = this.href;
                }, 300);
            });
        }
    </script>

</body>
</html>
