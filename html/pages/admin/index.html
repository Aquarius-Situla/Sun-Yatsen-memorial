<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>後台管理 - 私立中山紀念堂</title>
    
    <link rel="icon" href="../../main/favicon/favicon.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="admin.css">
    
    <!-- System Dark/Light theme-color -->
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <div class="login-header">
                <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h2>管理員登入</h2>
                <p>請輸入授權密碼以繼續</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="密碼" required autocomplete="current-password">
                </div>
                <button type="submit" class="ios-btn primary">登入</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <header class="ios-header">
            <div class="header-left">
                <h1>彈幕管理</h1>
            </div>
            <div class="header-right">
                <button id="refresh-btn" class="icon-btn" title="重新整理">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
                <button id="logout-btn" class="ios-btn secondary small">登出</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="stats-card">
                <div class="stat-item">
                    <span class="stat-label">總彈幕數</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
            </div>

            <div class="settings-card">
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">白名單模式</span>
                        <span class="setting-desc">開啟後，僅允許發送預設的致敬語。</span>
                    </div>
                    <label class="ios-switch">
                        <input type="checkbox" id="whitelist-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>

            <div class="settings-card">
                <div class="list-header" style="padding: 16px 20px 0; border-bottom: none;">
                    <h2>過濾名單管理</h2>
                </div>
                
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">基礎黑名單 (.json)</span>
                        <span class="setting-desc">目前詞彙數：<strong id="base-count-display">0</strong></span>
                    </div>
                    <div class="upload-wrapper">
                        <input type="file" id="base-upload-input" accept=".json" style="display: none;">
                        <button class="ios-btn secondary small" onclick="document.getElementById('base-upload-input').click()">上傳取代</button>
                    </div>
                </div>

                <div class="setting-item" style="border-top: 1px solid var(--border);">
                    <div class="setting-info">
                        <span class="setting-title">隱私黑名單 (.json)</span>
                        <span class="setting-desc">目前詞彙數：<strong id="private-count-display">0</strong></span>
                    </div>
                    <div class="upload-wrapper">
                        <input type="file" id="private-upload-input" accept=".json" style="display: none;">
                        <button class="ios-btn secondary small" onclick="document.getElementById('private-upload-input').click()">上傳取代</button>
                    </div>
                </div>
            </div>

            <div class="settings-card">
                <div class="list-header" style="padding: 16px 20px 0; border-bottom: none; display: flex; justify-content: space-between; align-items: center;">
                    <h2>AI 矩陣審查 (Async Mode)</h2>
                    <button id="add-ai-btn" title="新增 AI 節點" style="background: none; border: none; cursor: pointer; color: var(--primary); padding: 4px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                    </button>
                </div>
                
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">啟用 AI 矩陣</span>
                        <span class="setting-desc">隨機負載平衡，若違規會自動進入自學黑名單。</span>
                    </div>
                    <label class="ios-switch">
                        <input type="checkbox" id="ai-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">中國區特供審查 (China Censor Mode)</span>
                        <span class="setting-desc">啟用後，AI 將加強攔截特定地區的政治敏感與爭議詞彙。</span>
                    </div>
                    <label class="ios-switch">
                        <input type="checkbox" id="ai-china-toggle">
                        <span class="slider"></span>
                    </label>
                </div>

                <div id="ai-list-container" class="ios-list" style="margin: 0; padding-bottom: 12px; border-bottom: none;">
                    <!-- AI Models will be injected here -->
                </div>

                <div id="add-ai-form" class="setting-item" style="display: none; border-top: 1px solid var(--border); flex-direction: column; align-items: flex-start; gap: 12px; background: var(--hover-color);">
                    <div style="width: 100%;">
                        <label style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: block;">API Endpoint URL</label>
                        <input type="text" id="ai-endpoint" class="ios-input" placeholder="https://api.openai.com/v1/chat/completions" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--header-bg); color: var(--text-primary);">
                    </div>
                    <div style="width: 100%;">
                        <label style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: block;">Model Name</label>
                        <input type="text" id="ai-model" class="ios-input" placeholder="gpt-4o-mini" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--header-bg); color: var(--text-primary);">
                    </div>
                    <div style="width: 100%;">
                        <label style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; display: block;">API Keys (一行一個)</label>
                        <textarea id="ai-keys" class="ios-input" rows="3" placeholder="sk-xxxxxxx..." style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--header-bg); color: var(--text-primary); resize: vertical;"></textarea>
                    </div>
                    <button class="ios-btn primary" id="save-ai-btn" style="width: 100%;">儲存並加入矩陣</button>
                </div>
            </div>

            <div class="settings-card">
                <div class="list-header" style="padding: 16px 20px 0; border-bottom: none;">
                    <h2>自學黑名單紀錄</h2>
                </div>
                <div class="setting-item">
                    <div class="setting-info">
                        <span class="setting-title">LLM Blacklist</span>
                        <span class="setting-desc">已自動攔截了 <span id="llm-count-display" style="font-weight: 600; color: var(--primary);">0</span> 個新詞彙</span>
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button id="download-llm-btn" title="下載審查記錄" style="background: none; border: none; cursor: pointer; color: var(--primary); padding: 4px; display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="7 10 12 15 17 10"></polyline>
                                <line x1="12" y1="15" x2="12" y2="3"></line>
                            </svg>
                        </button>
                        <button id="clear-llm-btn" title="一鍵清空" style="background: none; border: none; cursor: pointer; color: var(--red); padding: 4px; display: flex; align-items: center; justify-content: center;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <div class="list-container">
                <div class="list-header" style="display: flex; justify-content: space-between; align-items: center; padding-right: 16px;">
                    <h2>近期彈幕</h2>
                    <button id="download-json-btn" title="下載彈幕樣本 (.json)" style="background: none; border: none; cursor: pointer; color: var(--primary); padding: 4px;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="7 10 12 15 17 10"></polyline>
                            <line x1="12" y1="15" x2="12" y2="3"></line>
                        </svg>
                    </button>
                </div>
                <div id="danmaku-list" class="ios-list">
                    <!-- Items will be injected here -->
                    <div class="empty-state">載入中...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Environment variables to locate the worker -->
    <script src="../../api/env.js"></script>
    <script src="admin.js"></script>
</body>
</html>
