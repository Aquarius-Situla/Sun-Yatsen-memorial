<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>後台管理 - 私立中山紀念堂</title>
    
    <link rel="icon" href="../../main/favicon/favicon.svg" type="image/svg+xml">
    
    <link rel="stylesheet" href="admin.css">
    
    <!-- System Dark/Light theme-color -->
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
</head>
<body>
    <!-- Login Screen -->
    <div id="login-screen" class="screen active">
        <div class="login-card">
            <div class="login-header">
                <svg viewBox="0 0 24 24" width="40" height="40" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                <h2>管理員登入</h2>
                <p>請輸入授權密碼以繼續</p>
            </div>
            <form id="login-form">
                <div class="input-group">
                    <input type="password" id="admin-password" placeholder="密碼" required autocomplete="current-password">
                </div>
                <button type="submit" class="ios-btn primary">登入</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="screen">
        <header class="ios-header">
            <div class="header-left">
                <h1>彈幕管理</h1>
            </div>
            <div class="header-right">
                <button id="refresh-btn" class="icon-btn" title="重新整理">
                    <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="23 4 23 10 17 10"></polyline>
                        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                    </svg>
                </button>
                <button id="logout-btn" class="ios-btn secondary small">登出</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="stats-card">
                <div class="stat-item">
                    <span class="stat-label">總彈幕數</span>
                    <span class="stat-value" id="total-count">0</span>
                </div>
            </div>

            <div class="list-container">
                <div class="list-header">
                    <h2>近期彈幕</h2>
                </div>
                <div id="danmaku-list" class="ios-list">
                    <!-- Items will be injected here -->
                    <div class="empty-state">載入中...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Environment variables to locate the worker -->
    <script src="../../api/env.js"></script>
    <script src="admin.js"></script>
</body>
</html>
