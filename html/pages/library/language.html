    <script>
        /* Immediate device fingerprinting to eliminate layout flash */
        (function() {
            var ua = navigator.userAgent || '';
            var platform = navigator.platform || '';
            var isIPad = /iPad/i.test(ua) || /iPad/i.test(platform) || ((platform === 'MacIntel' || ua.indexOf('Macintosh') !== -1) && navigator.maxTouchPoints > 1);
            var isIPhone = /iPhone|iPod/i.test(ua) || platform === 'iPhone' || platform === 'iPod';
            var isAndroidMobile = /Android.*Mobile/i.test(ua);
            var isAndroidTablet = /Android(?!.*Mobile)/i.test(ua);
            var isPhone = isIPhone || isAndroidMobile || (navigator.maxTouchPoints > 0 && Math.min(window.screen.width, window.screen.height) <= 480);
            var isTablet = isIPad || isAndroidTablet;
            var isMobile = isPhone || isTablet || window.innerWidth <= 768;
            var docEl = document.documentElement;
            if (isMobile) {
                docEl.classList.add('device-mobile');
                if (isTablet) docEl.classList.add('device-tablet');
                if (isPhone) docEl.classList.add('device-phone');
                if (isIPad) docEl.classList.add('device-ipad');
                if (isIPhone) docEl.classList.add('device-iphone');
            } else {
                docEl.classList.add('device-desktop');
            }
        })();
    </script>

    <script type="module">
        import { getCurrentLang, getLanguageMode, setGlobalLang, syncTabBarLabels, t } from '../../js/modules/i18n.js?v=20260907b';
        import { initTabBar, syncStandaloneTabBar } from '../../js/modules/tab-bar.js?v=20260907b';
        import { initIOSNavTransition } from '../../js/modules/ios-nav-transition.js?v=20260907b';
        import { initDesktopShell } from '../../js/modules/desktop-shell.js?v=20260907b';
        import { initDeviceLayout, initOrientationGuard } from '../../js/modules/device-detect.js?v=20260907b';

        initTabBar({
            activeTab: 'settings',
            basePath: '../../'
        });
        syncStandaloneTabBar();
        initIOSNavTransition();
        initDeviceLayout();
        initOrientationGuard();
        initDesktopShell({ activeTab: 'settings', basePath: '../../' });

        const rowAuto = document.getElementById('lang-row-auto');
        const rowTc = document.getElementById('lang-row-tc');
        const rowSc = document.getElementById('lang-row-sc');
        const pageTitle = document.getElementById('page-title');
        const topNavTitle = document.getElementById('top-nav-title');
        const navBackText = document.getElementById('nav-back-text');
        const sectionHeader = document.getElementById('section-header-lang');
        const footerText = document.getElementById('lang-footer-text');
        const autoTitle = document.getElementById('lang-auto-title');
        const autoDesc = document.getElementById('lang-auto-desc');
        const langBtn = document.getElementById('lang-btn');

        function updateUI() {
            const mode = getLanguageMode();
            const effectiveLang = getCurrentLang();
            const isTc = effectiveLang === 'tc';

            document.documentElement.lang = isTc ? 'zh-TW' : 'zh-CN';

            /* Update checkmark selection state for all rows */
            if (rowAuto) rowAuto.classList.toggle('selected', mode === 'auto');
            if (rowTc) rowTc.classList.toggle('selected', mode === 'tc');
            if (rowSc) rowSc.classList.toggle('selected', mode === 'sc');

            /* Update localized texts from modular i18n engine */
            if (pageTitle) pageTitle.textContent = t('lang_page_title');
            if (topNavTitle) topNavTitle.textContent = t('lang_top_title');
            if (navBackText) navBackText.textContent = t('lang_back_text');
            if (sectionHeader) sectionHeader.textContent = t('lang_section_header');
            if (footerText) footerText.textContent = t('lang_footer');

            if (autoTitle) autoTitle.textContent = t('lang_opt_auto_title');
            if (autoDesc) {
                const effectiveName = isTc ? t('lang_opt_tc_title') : t('lang_opt_sc_title');
                autoDesc.textContent = t('lang_opt_auto_current', effectiveName);
            }

            if (langBtn) {
                langBtn.textContent = isTc ? t('btn_toggle_to_sc') : t('btn_toggle_to_tc');
            }

            syncTabBarLabels();
        }

        /* Initial UI synchronization */
        updateUI();

        /* Bind click handlers for options */
        if (rowAuto) {
            rowAuto.addEventListener('click', () => {
                setGlobalLang('auto');
                updateUI();
            });
        }

        if (rowTc) {
            rowTc.addEventListener('click', () => {
                setGlobalLang('tc');
                updateUI();
            });
        }

        if (rowSc) {
            rowSc.addEventListener('click', () => {
                setGlobalLang('sc');
                updateUI();
            });
        }

        if (langBtn) {
            langBtn.addEventListener('click', () => {
                const nextLang = getCurrentLang() === 'tc' ? 'sc' : 'tc';
                setGlobalLang(nextLang);
                updateUI();
            });
        }

        /* Synchronize on global language change event */
        window.addEventListener('sys-lang-change', () => {
            updateUI();
        });
    </script>
