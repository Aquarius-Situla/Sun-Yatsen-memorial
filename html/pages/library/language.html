    <script type="module">
        import { getCurrentLang, setGlobalLang, syncTabBarLabels } from '../../js/modules/i18n.js?v=2024';
        import { initTabBar, syncStandaloneTabBar } from '../../js/modules/tab-bar.js?v=2024';

        initTabBar({
            activeTab: 'library',
            basePath: '../../'
        });
        syncStandaloneTabBar();

        const strings = {
            tc: {
                pageTitle: '語言偏好 - 私立中山紀念堂',
                topTitle: '語言偏好',
                backText: '資料庫',
                sectionHeader: '偏好語言 (PREFERRED LANGUAGES)',
                footer: '選擇在私立中山紀念堂中顯示的語言偏好。系統將自動保存您的偏好設定。',
                toggleBtn: '切换至简化字'
            },
            sc: {
                pageTitle: '语言偏好 - 私立中山纪念堂',
                topTitle: '语言偏好',
                backText: '资料库',
                sectionHeader: '偏好语言 (PREFERRED LANGUAGES)',
                footer: '选择在私立中山纪念堂中显示的语言偏好。系统将自动保存您的偏好设置。',
                toggleBtn: '切換至正體字'
            }
        };

        const rowTc = document.getElementById('lang-row-tc');
        const rowSc = document.getElementById('lang-row-sc');
        const pageTitle = document.getElementById('page-title');
        const topNavTitle = document.getElementById('top-nav-title');
        const navBackText = document.getElementById('nav-back-text');
        const sectionHeader = document.getElementById('section-header-lang');
        const footerText = document.getElementById('lang-footer-text');
        const langBtn = document.getElementById('lang-btn');

        function updateUI(lang) {
            const isTc = lang === 'tc';
            document.documentElement.lang = isTc ? 'zh-TW' : 'zh-CN';

            if (rowTc && rowSc) {
                if (isTc) {
                    rowTc.classList.add('selected');
                    rowSc.classList.remove('selected');
                } else {
                    rowSc.classList.add('selected');
                    rowTc.classList.remove('selected');
                }
            }

            const t = strings[lang] || strings.tc;
            if (pageTitle) pageTitle.textContent = t.pageTitle;
            if (topNavTitle) topNavTitle.textContent = t.topTitle;
            if (navBackText) navBackText.textContent = t.backText;
            if (sectionHeader) sectionHeader.textContent = t.sectionHeader;
            if (footerText) footerText.textContent = t.footer;
            if (langBtn) langBtn.textContent = t.toggleBtn;

            syncTabBarLabels();
        }

        const initialLang = getCurrentLang();
        updateUI(initialLang);

        rowTc.addEventListener('click', () => {
            setGlobalLang('tc');
            updateUI('tc');
        });

        rowSc.addEventListener('click', () => {
            setGlobalLang('sc');
            updateUI('sc');
        });

        if (langBtn) {
            langBtn.addEventListener('click', () => {
                const nextLang = getCurrentLang() === 'tc' ? 'sc' : 'tc';
                setGlobalLang(nextLang);
                updateUI(nextLang);
            });
        }

        window.addEventListener('sys-lang-change', (e) => {
            if (e.detail && e.detail.lang) {
                updateUI(e.detail.lang);
            }
        });
    </script>
