    <script type="module">
        /* ====================================================================
         * Library Module Initialization & Dynamic Language Toggle
         * ==================================================================== */
        import { getCurrentLang, setGlobalLang, syncTabBarLabels } from '../../js/modules/i18n.js';
        import { syncStandaloneTabBar } from '../../js/modules/tab-bar.js';

        const i18nStrings = {
            tc: {
                pageTitle: '資料庫 - 私立中山紀念堂',
                topNavTitle: '資料庫',
                archivesHeader: '文獻與歷史 (ARCHIVES & HISTORY)',
                prefsHeader: '偏好設定 (PREFERENCES)',
                biography: '國父生平傳記',
                valBiography: '年譜與思想',
                about: '關於紀念館與聲明',
                valAbout: '館舍與法規',
                thanks: '特別鳴謝名單',
                valThanks: '開源與貢獻',
                lang: '全域語言 (Language)',
                langText: '正體中文',
                toggleBtn: '切换至简化字'
            },
            sc: {
                pageTitle: '资料库 - 私立中山纪念堂',
                topNavTitle: '资料库',
                archivesHeader: '文献与历史 (ARCHIVES & HISTORY)',
                prefsHeader: '偏好设置 (PREFERENCES)',
                biography: '国父生平传记',
                valBiography: '年谱与思想',
                about: '关于纪念馆与声明',
                valAbout: '馆舍与法规',
                thanks: '特别鸣谢名单',
                valThanks: '开源与贡献',
                lang: '全局语言 (Language)',
                langText: '简体中文',
                toggleBtn: '切換至正體字'
            }
        };

        function updateTexts(lang) {
            const strings = i18nStrings[lang] || i18nStrings.tc;
            document.title = strings.pageTitle;
            const topNavTitle = document.getElementById('top-nav-title');
            if (topNavTitle) topNavTitle.textContent = strings.topNavTitle;

            const archivesHeader = document.getElementById('section-archives-header');
            if (archivesHeader) archivesHeader.textContent = strings.archivesHeader;

            const prefsHeader = document.getElementById('section-prefs-header');
            if (prefsHeader) prefsHeader.textContent = strings.prefsHeader;

            const labelBiography = document.getElementById('label-biography');
            if (labelBiography) labelBiography.textContent = strings.biography;

            const valBiography = document.getElementById('val-biography');
            if (valBiography) valBiography.textContent = strings.valBiography;

            const labelAbout = document.getElementById('label-about');
            if (labelAbout) labelAbout.textContent = strings.about;

            const valAbout = document.getElementById('val-about');
            if (valAbout) valAbout.textContent = strings.valAbout;

            const labelThanks = document.getElementById('label-thanks');
            if (labelThanks) labelThanks.textContent = strings.thanks;

            const valThanks = document.getElementById('val-thanks');
            if (valThanks) valThanks.textContent = strings.valThanks;

            const labelLang = document.getElementById('label-lang');
            if (labelLang) labelLang.textContent = strings.lang;

            const langText = document.getElementById('current-lang-text');
            if (langText) langText.textContent = strings.langText;

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) langBtn.textContent = strings.toggleBtn;

            syncTabBarLabels();
        }

        const currentLang = getCurrentLang();
        updateTexts(currentLang);
        syncStandaloneTabBar();


        const langBtn = document.getElementById('lang-btn');
        if (langBtn) {
            langBtn.addEventListener('click', () => {
                const nextLang = getCurrentLang() === 'tc' ? 'sc' : 'tc';
                setGlobalLang(nextLang);
                updateTexts(nextLang);
            });
        }

        window.addEventListener('sys-lang-change', (e) => {
            if (e.detail && e.detail.lang) {
                updateTexts(e.detail.lang);
            }
        });
    </script>
