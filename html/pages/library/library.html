                labelMayfourth: '五四运动与新文化',
                valMayfourth: '五月四日',
                toggleBtn: '切換至正體字'
            }
        };

        function updateTexts(lang) {
            const strings = i18nStrings[lang] || i18nStrings.tc;
            document.title = strings.pageTitle;

            const topNavTitle = document.getElementById('top-nav-title');
            if (topNavTitle) topNavTitle.textContent = strings.topNavTitle;

            const secYatsenHeader = document.getElementById('section-yatsen-header');
            if (secYatsenHeader) secYatsenHeader.textContent = strings.secYatsenHeader;

            const secExhibitsHeader = document.getElementById('section-exhibits-header');
            if (secExhibitsHeader) secExhibitsHeader.textContent = strings.secExhibitsHeader;

            const labelBiography = document.getElementById('label-biography');
            if (labelBiography) labelBiography.textContent = strings.labelBiography;

            const valBiography = document.getElementById('val-biography');
            if (valBiography) valBiography.textContent = strings.valBiography;

            const labelYatsenBirth = document.getElementById('label-yatsen-birth');
            if (labelYatsenBirth) labelYatsenBirth.textContent = strings.labelYatsenBirth;

            const valYatsenBirth = document.getElementById('val-yatsen-birth');
            if (valYatsenBirth) valYatsenBirth.textContent = strings.valYatsenBirth;

            const labelYatsenPassing = document.getElementById('label-yatsen-passing');
            if (labelYatsenPassing) labelYatsenPassing.textContent = strings.labelYatsenPassing;

            const valYatsenPassing = document.getElementById('val-yatsen-passing');
            if (valYatsenPassing) valYatsenPassing.textContent = strings.valYatsenPassing;

            const labelXinhai = document.getElementById('label-xinhai');
            if (labelXinhai) labelXinhai.textContent = strings.labelXinhai;

            const valXinhai = document.getElementById('val-xinhai');
            if (valXinhai) valXinhai.textContent = strings.valXinhai;

            const labelWhampoa = document.getElementById('label-whampoa');
            if (labelWhampoa) labelWhampoa.textContent = strings.labelWhampoa;

            const valWhampoa = document.getElementById('val-whampoa');
            if (valWhampoa) valWhampoa.textContent = strings.valWhampoa;

            const labelMilitaries = document.getElementById('label-militaries');
            if (labelMilitaries) labelMilitaries.textContent = strings.labelMilitaries;

            const valMilitaries = document.getElementById('val-militaries');
            if (valMilitaries) valMilitaries.textContent = strings.valMilitaries;

            const labelMayfourth = document.getElementById('label-mayfourth');
            if (labelMayfourth) labelMayfourth.textContent = strings.labelMayfourth;

            const valMayfourth = document.getElementById('val-mayfourth');
            if (valMayfourth) valMayfourth.textContent = strings.valMayfourth;

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) langBtn.textContent = strings.toggleBtn;

            syncTabBarLabels();
        }

        const currentLang = getCurrentLang();
        updateTexts(currentLang);
        syncStandaloneTabBar();
        initIOSNavTransition();
        initDesktopShell({ activeTab: 'library', basePath: '../../' });

        const langBtn = document.getElementById('lang-btn');
        if (langBtn) {
            langBtn.addEventListener('click', () => {
                const nextLang = getCurrentLang() === 'tc' ? 'sc' : 'tc';
                setGlobalLang(nextLang);
                updateTexts(nextLang);
            });
        }

        window.addEventListener('sys-lang-change', (e) => {
            if (e.detail && e.detail.lang) {
                updateTexts(e.detail.lang);
            }
        });
