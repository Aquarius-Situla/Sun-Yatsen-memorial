    <script>
        /* Immediate device fingerprinting to eliminate layout flash */
        (function() {
            var ua = navigator.userAgent || '';
            var platform = navigator.platform || '';
            var isIPad = /iPad/i.test(ua) || /iPad/i.test(platform) || ((platform === 'MacIntel' || ua.indexOf('Macintosh') !== -1) && navigator.maxTouchPoints > 1);
            var isIPhone = /iPhone|iPod/i.test(ua) || platform === 'iPhone' || platform === 'iPod';
            var isAndroidMobile = /Android.*Mobile/i.test(ua);
            var isAndroidTablet = /Android(?!.*Mobile)/i.test(ua);
            var isPhone = isIPhone || isAndroidMobile || (navigator.maxTouchPoints > 0 && Math.min(window.screen.width, window.screen.height) <= 480);
            var isTablet = isIPad || isAndroidTablet;
            var isMobile = isPhone || isTablet || window.innerWidth <= 768;
            var docEl = document.documentElement;
            if (isMobile) {
                docEl.classList.add('device-mobile');
                if (isTablet) docEl.classList.add('device-tablet');
                if (isPhone) docEl.classList.add('device-phone');
                if (isIPad) docEl.classList.add('device-ipad');
                if (isIPhone) docEl.classList.add('device-iphone');
            } else {
                docEl.classList.add('device-desktop');
            }
        })();
    </script>

    <script type="module">
        /* ====================================================================
         * Settings Module Initialization & Dynamic Language Toggle
         * ==================================================================== */
        import { getCurrentLang, setGlobalLang, syncTabBarLabels } from '../../js/modules/i18n.js?v=20260907a';
        import { syncStandaloneTabBar } from '../../js/modules/tab-bar.js?v=20260907a';
        import { initIOSNavTransition } from '../../js/modules/ios-nav-transition.js?v=20260907a';
        import { initDesktopShell } from '../../js/modules/desktop-shell.js?v=20260907a';
import { initDeviceLayout, initOrientationGuard } from '../../js/modules/device-detect.js?v=20260907a';

        const i18nStrings = {
            tc: {
                pageTitle: '設定 - 私立中山紀念堂',
                topNavTitle: '設定',
                secPrefHeader: '偏好設定 (PREFERENCES)',
                secAboutHeader: '關於與聲明 (ABOUT & LEGAL)',
                secSysHeader: '系統資訊 (SYSTEM INFO)',
                labelLang: '全域語言 (Language)',
                langText: '正體中文',
                labelAbout: '關於紀念館與聲明',
                valAbout: '館舍與法規',
                labelThanks: '特別鳴謝名單',
                valThanks: '開源與貢獻',
                labelOfficial: '國父紀念館官方網站',
                labelVersion: '應用版本',
                labelArchiveSystem: '典藏系統',
                valArchiveSystem: '私立中山紀念堂',
                toggleBtn: '切换至简化字'
            },
            sc: {
                pageTitle: '设置 - 私立中山纪念堂',
                topNavTitle: '设置',
                secPrefHeader: '偏好设置 (PREFERENCES)',
                secAboutHeader: '关于与声明 (ABOUT & LEGAL)',
                secSysHeader: '系统信息 (SYSTEM INFO)',
                labelLang: '全局语言 (Language)',
                langText: '简体中文',
                labelAbout: '关于纪念馆与声明',
                valAbout: '馆舍与法规',
                labelThanks: '特别鸣谢名单',
                valThanks: '开源与贡献',
                labelOfficial: '国父纪念馆官方网站',
                labelVersion: '应用版本',
                labelArchiveSystem: '典藏系统',
                valArchiveSystem: '私立中山纪念堂',
                toggleBtn: '切換至正體字'
            }
        };

        function updateTexts(lang) {
            const strings = i18nStrings[lang] || i18nStrings.tc;
            document.title = strings.pageTitle;

            const topNavTitle = document.getElementById('top-nav-title');
            if (topNavTitle) topNavTitle.textContent = strings.topNavTitle;

            const secPrefHeader = document.getElementById('sec-pref-header');
            if (secPrefHeader) secPrefHeader.textContent = strings.secPrefHeader;

            const secAboutHeader = document.getElementById('sec-about-header');
            if (secAboutHeader) secAboutHeader.textContent = strings.secAboutHeader;

            const secSysHeader = document.getElementById('sec-sys-header');
            if (secSysHeader) secSysHeader.textContent = strings.secSysHeader;

            const labelLang = document.getElementById('label-lang');
            if (labelLang) labelLang.textContent = strings.labelLang;

            const currentLangText = document.getElementById('current-lang-text');
            if (currentLangText) currentLangText.textContent = strings.langText;

            const labelAbout = document.getElementById('label-about');
            if (labelAbout) labelAbout.textContent = strings.labelAbout;

            const valAbout = document.getElementById('val-about');
            if (valAbout) valAbout.textContent = strings.valAbout;

            const labelThanks = document.getElementById('label-thanks');
            if (labelThanks) labelThanks.textContent = strings.labelThanks;

            const valThanks = document.getElementById('val-thanks');
            if (valThanks) valThanks.textContent = strings.valThanks;

            const labelOfficial = document.getElementById('label-official');
            if (labelOfficial) labelOfficial.textContent = strings.labelOfficial;

            const labelVersion = document.getElementById('label-version');
            if (labelVersion) labelVersion.textContent = strings.labelVersion;

            const labelArchiveSystem = document.getElementById('label-archive-system');
            if (labelArchiveSystem) labelArchiveSystem.textContent = strings.labelArchiveSystem;

            const valArchiveSystem = document.getElementById('val-archive-system');
            if (valArchiveSystem) valArchiveSystem.textContent = strings.valArchiveSystem;

            const langBtn = document.getElementById('lang-btn');
            if (langBtn) langBtn.textContent = strings.toggleBtn;

            syncTabBarLabels();
        }

        const currentLang = getCurrentLang();
        updateTexts(currentLang);
        syncStandaloneTabBar();
        initIOSNavTransition();
        initDeviceLayout();
        initOrientationGuard();
        initDesktopShell({ activeTab: 'settings', basePath: '../../' });

        const langBtn = document.getElementById('lang-btn');
        if (langBtn) {
            langBtn.addEventListener('click', () => {
                const nextLang = getCurrentLang() === 'tc' ? 'sc' : 'tc';
                setGlobalLang(nextLang);
                updateTexts(nextLang);
            });
        }

        window.addEventListener('sys-lang-change', (e) => {
            if (e.detail && e.detail.lang) {
                updateTexts(e.detail.lang);
            }
        });
    </script>
