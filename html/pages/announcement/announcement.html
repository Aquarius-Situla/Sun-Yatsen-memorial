                sc: { title: '声援乌克兰', pageTitle: '声援乌克兰 - 私立中山纪念堂', src: './Ukraine_sc.md' }
            },

                sc: { title: '声援乌克兰', pageTitle: '声援乌克兰 - 私立中山纪念堂', src: './Ukraine_sc.md' }

        let currentDetailItem = null;

        const masterContainer = document.getElementById('ios-master-container');
        const detailSheet = document.getElementById('announcement-detail-sheet');

        const topNavTitle = document.getElementById('top-nav-title');
        const subpageNavTitle = document.getElementById('subpage-nav-title');
        const pageTitleEl = document.getElementById('page-title');

        function syncAnnouncementTexts(lang) {
            const s = announcementStrings[lang] || announcementStrings.tc;
            if (!currentDetailItem) {
                if (pageTitleEl) pageTitleEl.textContent = s.pageTitle;
                if (topNavTitle) topNavTitle.textContent = s.topTitle;
            }

            const secAnn = document.getElementById('sec-announcements');
            if (secAnn) secAnn.textContent = s.secAnnounce;

            const labelStatus = document.getElementById('label-status');
            if (labelStatus) labelStatus.textContent = s.status;
            const valStatus = document.getElementById('val-status');
            if (valStatus) valStatus.textContent = s.valStatus;

            const labelMemorial = document.getElementById('label-memorial');
            if (labelMemorial) labelMemorial.textContent = s.memorial;
            const valMemorial = document.getElementById('val-memorial');
            if (valMemorial) valMemorial.textContent = s.valMemorial;

            const labelUkraine = document.getElementById('label-ukraine');

            const valUkraine = document.getElementById('val-ukraine');
            if (valUkraine) valUkraine.textContent = s.valUkraine;
        }

        /* ====================================================================
         * Sheet Open Animation (Native iOS Forward Push)
         * ==================================================================== */
        function openDetailSheet(itemKey, pushHistory = true) {
            if (isSheetTransitioning) return;
            const config = itemConfigs[itemKey] || itemConfigs.status;
            currentDetailItem = itemKey;
            isSheetTransitioning = true;

            const lang = getCurrentLang();
            const localized = config[lang] || config.tc;

            if (subpageNavTitle) subpageNavTitle.textContent = localized.title;
            if (pageTitleEl) pageTitleEl.textContent = localized.pageTitle;
            if (sheetMdViewer) {
                if (sheetMdViewer.getAttribute('src') !== localized.src) {
                    sheetMdViewer.setAttribute('src', localized.src);
                }
            }

            if (pushHistory) {
                try {
                    history.pushState({ item: itemKey }, '', 'detail.html?item=' + itemKey);
                } catch (e) {
                    /* History fallback */
                }
            }

            detailSheet.scrollTop = 0;
            detailSheet.style.display = 'block';
            detailSheet.style.transform = 'translate3d(100%, 0, 0)';
            detailSheet.classList.remove('active', 'sliding-out');

            navBackLink.style.display = 'flex';
            subpageNavTitle.style.display = 'flex';
            topNavTitle.style.display = 'none';

            const chevronSvg = navBackLink.querySelector('svg');
            if (chevronSvg) chevronSvg.classList.add('ios-nav-chevron-enter');

            /* Compute dynamic center offset for back label entering from center */
            const rect = navBackText.getBoundingClientRect();
            const currentCenterX = rect.left + rect.width / 2;
            const screenCenterX = window.innerWidth / 2;
            const offset = screenCenterX - currentCenterX;
            navBackText.style.setProperty('--nav-center-offset', offset + 'px');
            navBackText.classList.add('ios-nav-label-sliding-from-center');

            subpageNavTitle.classList.add('ios-nav-title-enter');

            requestAnimationFrame(() => {
                requestAnimationFrame(() => {
                    detailSheet.classList.add('animating');
                    detailSheet.style.transform = 'translate3d(0, 0, 0)';
                    masterContainer.classList.add('pushed');

                    if (chevronSvg) {
                        chevronSvg.classList.remove('ios-nav-chevron-enter');
                        chevronSvg.classList.add('ios-nav-chevron-enter-active');
                    }

                    subpageNavTitle.classList.remove('ios-nav-title-enter');
                    subpageNavTitle.classList.add('ios-nav-title-enter-active');

                    setTimeout(() => {
                        detailSheet.classList.remove('animating');
                        detailSheet.classList.add('active');
                        detailSheet.style.transform = '';

                        if (chevronSvg) chevronSvg.classList.remove('ios-nav-chevron-enter-active');
                        navBackText.classList.remove('ios-nav-label-sliding-from-center');
                        navBackText.style.removeProperty('--nav-center-offset');
                        subpageNavTitle.classList.remove('ios-nav-title-enter-active');
                        isSheetTransitioning = false;
                    }, 280);
                });
            });
        }

        /* ====================================================================
         * Sheet Close Animation (Native iOS Settings Return Transition)
         * ==================================================================== */
        function closeDetailSheet(pushHistory = true) {
            if (isSheetTransitioning || !currentDetailItem) return;
            isSheetTransitioning = true;

            const chevronSvg = navBackLink.querySelector('svg');

            /* Dynamically compute exact center offset for the back text */
            const rect = navBackText.getBoundingClientRect();
            const currentCenterX = rect.left + rect.width / 2;
            const screenCenterX = window.innerWidth / 2;
            const offset = screenCenterX - currentCenterX;
            navBackText.style.setProperty('--nav-center-offset', offset + 'px');

            /* Trigger authentic Apple Settings nav animations */
            if (chevronSvg) chevronSvg.classList.add('ios-nav-chevron-exit');
            subpageNavTitle.classList.add('ios-nav-title-exit');
            navBackText.classList.add('ios-nav-label-sliding-center');

            /* Slide out detail sheet and restore parent container */
            detailSheet.classList.remove('active');
            detailSheet.classList.add('sliding-out');
            masterContainer.classList.remove('pushed');

            if (pushHistory) {
                try {
                    history.pushState(null, '', 'announcement.html');
                } catch (e) {
                    /* History fallback */
                }
            }

            const lang = getCurrentLang();
            const s = announcementStrings[lang] || announcementStrings.tc;
            if (pageTitleEl) pageTitleEl.textContent = s.pageTitle;

            setTimeout(() => {
                detailSheet.style.display = 'none';
                detailSheet.classList.remove('sliding-out');
                detailSheet.style.transform = '';

                navBackLink.style.display = 'none';
                if (chevronSvg) chevronSvg.classList.remove('ios-nav-chevron-exit');
                navBackText.classList.remove('ios-nav-label-sliding-center');
                navBackText.style.removeProperty('--nav-center-offset');

                subpageNavTitle.style.display = 'none';
                subpageNavTitle.classList.remove('ios-nav-title-exit');
                topNavTitle.style.display = 'flex';

                currentDetailItem = null;
                isSheetTransitioning = false;
            }, 280);
        }

        /* ====================================================================
         * Left-Edge Interactive Swipe Gesture for Detail Sheet
         * ==================================================================== */
        let sheetTouchStartX = 0;
        let sheetTouchStartY = 0;
        let sheetTouchStartTime = 0;
        let isSheetEdgeTracking = false;
        let isSheetSwiping = false;

        function stopSheetTracking() {
            isSheetEdgeTracking = false;
            isSheetSwiping = false;
            window.removeEventListener('touchmove', onSheetTouchMove);
        }

        function onSheetTouchStart(e) {
            if (isSheetTransitioning || !currentDetailItem || e.touches.length !== 1) return;
            const touch = e.touches[0];
            if (touch.clientY < 60 || (e.target && e.target.closest && e.target.closest('.apple-top-nav, .apple-tab-bar'))) {
                return;
            }
            if (touch.clientX <= 25) {
                sheetTouchStartX = touch.clientX;
                sheetTouchStartY = touch.clientY;
                sheetTouchStartTime = Date.now();
                isSheetEdgeTracking = true;
                isSheetSwiping = false;
                window.addEventListener('touchmove', onSheetTouchMove, { passive: false });
            }
        }

        function onSheetTouchMove(e) {
            if (!isSheetEdgeTracking || e.touches.length !== 1) return;
            const touch = e.touches[0];
            const deltaX = touch.clientX - sheetTouchStartX;
            const deltaY = touch.clientY - sheetTouchStartY;

            if (!isSheetSwiping) {
                if (Math.abs(deltaY) > Math.abs(deltaX)) {
                    stopSheetTracking();
                    return;
                }
                if (deltaX > 8 && Math.abs(deltaX) > Math.abs(deltaY)) {
                    isSheetSwiping = true;
                    detailSheet.classList.add('ios-content-dragging');
                    masterContainer.style.transition = 'none';
                }
            }

            if (isSheetSwiping) {
                if (e.cancelable) e.preventDefault();
                const currentX = Math.max(0, deltaX);
                const screenWidth = window.innerWidth || 375;
                const progress = Math.min(1, currentX / screenWidth);

                detailSheet.style.transform = 'translate3d(' + currentX + 'px, 0, 0)';
                const masterPercent = -30 * (1 - progress);
                masterContainer.style.transform = 'translate3d(' + masterPercent + '%, 0, 0)';
                masterContainer.style.opacity = String(0.8 + 0.2 * progress);

                const chevronSvg = navBackLink.querySelector('svg');
                if (chevronSvg) {
                    chevronSvg.style.transform = 'translate3d(' + (-14 * progress) + 'px, 0, 0)';
                    chevronSvg.style.opacity = String(1 - progress);
                }

                const rect = navBackText.getBoundingClientRect();
                const currentCenterX = rect.left + rect.width / 2;
                const screenCenterX = window.innerWidth / 2;
                const targetOffset = screenCenterX - currentCenterX;
                navBackText.style.transform = 'translate3d(' + (targetOffset * progress) + 'px, 0, 0)';
                if (progress < 0.35) {
                    navBackText.style.opacity = String(1 - (progress / 0.35));
                    navBackText.style.color = '';
                    navBackText.style.fontWeight = '';
                } else if (progress < 0.65) {
                    navBackText.style.opacity = '0';
                } else {
                    navBackText.style.opacity = String((progress - 0.65) / 0.35);
                    const isLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
                    navBackText.style.color = isLight ? '#000000' : '#ffffff';
                    navBackText.style.fontWeight = '600';
                }

                if (subpageNavTitle) {
                    subpageNavTitle.style.transform = 'translate3d(' + (60 * progress) + 'px, 0, 0)';
                    subpageNavTitle.style.opacity = String(1 - progress);
                }
            }
        }

        function onSheetTouchEnd(e) {
            if (!isSheetEdgeTracking && !isSheetSwiping) {
                window.removeEventListener('touchmove', onSheetTouchMove);
                return;
            }
            const wasSwiping = isSheetSwiping;
            stopSheetTracking();
            if (!wasSwiping) return;

            const touch = e.changedTouches[0];
            const deltaX = touch ? (touch.clientX - sheetTouchStartX) : 0;
            const elapsed = Math.max(1, Date.now() - sheetTouchStartTime);
            const velocity = deltaX / elapsed;
            const screenWidth = window.innerWidth || 375;
            const shouldCommit = (deltaX > screenWidth * 0.3) || (deltaX > 40 && velocity > 0.35);

            detailSheet.classList.remove('ios-content-dragging');

            if (shouldCommit) {
                closeDetailSheet(true);
            } else {
                /* Snap back to opened sheet */
                detailSheet.style.transition = 'transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1)';
                detailSheet.style.transform = 'translate3d(0, 0, 0)';

                masterContainer.style.transition = 'transform 0.24s cubic-bezier(0.2, 0.9, 0.3, 1), opacity 0.24s ease';
                masterContainer.style.transform = 'translate3d(-30%, 0, 0)';
                masterContainer.style.opacity = '0.8';

                const chevronSvg = navBackLink.querySelector('svg');
                if (chevronSvg) {
                    chevronSvg.style.transition = 'transform 0.24s ease, opacity 0.24s ease';
                    chevronSvg.style.transform = 'translate3d(0, 0, 0)';
                    chevronSvg.style.opacity = '1';
                }
                navBackText.style.transition = 'transform 0.24s ease, opacity 0.24s ease, color 0.2s ease';
                navBackText.style.transform = 'translate3d(0, 0, 0)';
                navBackText.style.opacity = '1';
                navBackText.style.color = '';
                navBackText.style.fontWeight = '';

                if (subpageNavTitle) {
                    subpageNavTitle.style.transition = 'transform 0.24s ease, opacity 0.24s ease';
                    subpageNavTitle.style.transform = 'translate3d(0, 0, 0)';
                    subpageNavTitle.style.opacity = '1';
                }

                setTimeout(() => {
                    detailSheet.style.transition = '';
                    detailSheet.style.transform = '';
                    masterContainer.style.transition = '';
                    masterContainer.style.transform = '';
                    masterContainer.style.opacity = '';
                    if (chevronSvg) {
                        chevronSvg.style.transition = '';
                        chevronSvg.style.transform = '';
                        chevronSvg.style.opacity = '';
                    }
                    navBackText.style.transition = '';
                    navBackText.style.transform = '';
                    navBackText.style.opacity = '';
                    navBackText.style.color = '';
                    navBackText.style.fontWeight = '';
                    if (subpageNavTitle) {
                        subpageNavTitle.style.transition = '';
                        subpageNavTitle.style.transform = '';
                        subpageNavTitle.style.opacity = '';
                    }
                }, 250);
            }
        }

        window.addEventListener('touchstart', onSheetTouchStart, { passive: true });
        window.addEventListener('touchend', onSheetTouchEnd, { passive: true });
        window.addEventListener('touchcancel', onSheetTouchEnd, { passive: true });

        /* ====================================================================
         * Event Listeners (Clicks, History, Language, Dark/Light Mode)
         * ==================================================================== */
        const announcementRows = document.querySelectorAll('.ios-row[data-detail-item]');
        announcementRows.forEach(row => {
            row.addEventListener('click', (e) => {
                e.preventDefault();
                const item = row.getAttribute('data-detail-item');
                if (item) {
                    openDetailSheet(item, true);
                }
            });
        });

        if (navBackLink) {
            navBackLink.addEventListener('click', (e) => {
                e.preventDefault();
                closeDetailSheet(true);
            });
        }

        window.addEventListener('popstate', (e) => {
            if (e.state && e.state.item) {
                openDetailSheet(e.state.item, false);
            } else {
                const params = new URLSearchParams(window.location.search);
                const item = params.get('item');
                if (item && itemConfigs[item]) {
                    openDetailSheet(item, false);
                } else if (currentDetailItem) {
                    closeDetailSheet(false);
                }
            }
        });

        /* Zero-MD theme updates */
        const colorSchemeQuery = window.matchMedia('(prefers-color-scheme: light)');
        function updateSheetMarkdownTheme() {
            if (!sheetMdViewer) return;
            const isLight = colorSchemeQuery.matches;
            const template = sheetMdViewer.querySelector('template');
            if (template) {
                const link = template.content.querySelector('link');
                if (link) {
                    link.href = isLight
                        ? '../../css/github-markdown.css'
                        : '../../css/github-markdown-dark.css';
                }
            }
            const currentSrc = sheetMdViewer.getAttribute('src');
            if (currentSrc) {
                sheetMdViewer.removeAttribute('src');
                requestAnimationFrame(() => sheetMdViewer.setAttribute('src', currentSrc));
            }
        }
        colorSchemeQuery.addEventListener('change', updateSheetMarkdownTheme);

        initSubpage({
            activeBottomTab: 'announcement',
            basePath: '../../'
        });

        syncStandaloneTabBar();
        syncAnnouncementTexts(getCurrentLang());

        /* Handle direct URL visits with ?item= parameter */
        const urlParams = new URLSearchParams(window.location.search);
        const initialItem = urlParams.get('item');
        if (initialItem && itemConfigs[initialItem]) {
            currentDetailItem = initialItem;
            const config = itemConfigs[initialItem];
            const lang = getCurrentLang();
            const localized = config[lang] || config.tc;

            if (subpageNavTitle) subpageNavTitle.textContent = localized.title;
            if (pageTitleEl) pageTitleEl.textContent = localized.pageTitle;
            if (sheetMdViewer) sheetMdViewer.setAttribute('src', localized.src);

            detailSheet.style.display = 'block';
            detailSheet.classList.add('active');
            masterContainer.classList.add('pushed');

            navBackLink.style.display = 'flex';
            subpageNavTitle.style.display = 'flex';
            topNavTitle.style.display = 'none';
        }

        window.addEventListener('sys-lang-change', (e) => {
            const lang = e.detail && e.detail.lang ? e.detail.lang : getCurrentLang();
            syncAnnouncementTexts(lang);
            if (currentDetailItem) {
                const config = itemConfigs[currentDetailItem] || itemConfigs.status;
                const localized = config[lang] || config.tc;
                if (subpageNavTitle) subpageNavTitle.textContent = localized.title;
                if (pageTitleEl) pageTitleEl.textContent = localized.pageTitle;
                if (sheetMdViewer) sheetMdViewer.setAttribute('src', localized.src);
            }
        });
    </script>
</body>
</html>
