        const announcementStrings = {
            tc: {
                pageTitle: '公告 - 私立中山紀念堂',
                topTitle: '公告',
                secAnnounce: '堂務公告 (ANNOUNCEMENTS)',
                status: '網站狀態',
                valStatus: '運行正常',
                memorial: '紀念日',
                valMemorial: '重要典禮',
                ukraine: '聲援烏克蘭',
                valUkraine: '和平聲明'
            },
            sc: {
                pageTitle: '公告 - 私立中山纪念堂',
                topTitle: '公告',
                secAnnounce: '堂务公告 (ANNOUNCEMENTS)',
                status: '网站状态',
                valStatus: '运行正常',
                memorial: '纪念日',
                valMemorial: '重要典礼',
                ukraine: '声援乌克兰',
                valUkraine: '和平声明'
            }
        };

        function syncAnnouncementTexts(lang) {
            const s = announcementStrings[lang] || announcementStrings.tc;
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) pageTitle.textContent = s.pageTitle;
            const topNavTitle = document.getElementById('top-nav-title');
            if (topNavTitle) topNavTitle.textContent = s.topTitle;

            const secAnn = document.getElementById('sec-announcements');
            if (secAnn) secAnn.textContent = s.secAnnounce;

            const labelStatus = document.getElementById('label-status');
            if (labelStatus) labelStatus.textContent = s.status;
            const valStatus = document.getElementById('val-status');
            if (valStatus) valStatus.textContent = s.valStatus;

            const labelMemorial = document.getElementById('label-memorial');
            if (labelMemorial) labelMemorial.textContent = s.memorial;
            const valMemorial = document.getElementById('val-memorial');
            if (valMemorial) valMemorial.textContent = s.valMemorial;

            const labelUkraine = document.getElementById('label-ukraine');
            if (labelUkraine) labelUkraine.textContent = s.ukraine;
            const valUkraine = document.getElementById('val-ukraine');
            if (valUkraine) valUkraine.textContent = s.valUkraine;
        }

        initSubpage({
            activeBottomTab: 'announcement',
            basePath: '../../'
        });

        syncStandaloneTabBar();
        syncAnnouncementTexts(getCurrentLang());
        window.addEventListener('sys-lang-change', (e) => {
            if (e.detail && e.detail.lang) {
                syncAnnouncementTexts(e.detail.lang);
            }
        });
    </script>
